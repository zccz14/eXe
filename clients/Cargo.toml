[workspace]
resolver = "2"
members = ["crates/exe-core", "crates/exe-cli", "crates/exe-mobile"]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
crypto_box = "0.9"
ed25519-dalek = "2"
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
