name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: tag matches the product version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json v$version"
            echo "every eXe component shares one version; bump it with pnpm version:sync -- <X.Y.Z>"
            exit 1
          fi
          echo "version v$version"

  desktop:
    needs: [version]
    name: exe ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Cross toolchain
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --manifest-path agent/Cargo.toml -p exe --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd agent/target/${{ matrix.target }}/release
          tar czf exe-${{ matrix.target }}.tar.gz exe
          shasum -a 256 exe-${{ matrix.target }}.tar.gz > exe-${{ matrix.target }}.tar.gz.sha256
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd agent/target/${{ matrix.target }}/release
          Compress-Archive -Path exe.exe -DestinationPath exe-${{ matrix.target }}.zip
          (Get-FileHash exe-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  exe-${{ matrix.target }}.zip" | Out-File exe-${{ matrix.target }}.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.target }}
          path: |
            agent/target/${{ matrix.target }}/release/exe-${{ matrix.target }}.t*
            agent/target/${{ matrix.target }}/release/exe-${{ matrix.target }}.z*

  mobile:
    name: mobile libraries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
            ndk: true
          - target: aarch64-apple-ios
            os: macos-14
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - uses: nttld/setup-ndk@v1
        if: matrix.ndk
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        if: matrix.ndk
        working-directory: agent
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - if: matrix.ndk
        working-directory: agent
        run: cargo ndk -t arm64-v8a build -p exe-mobile --release
      - if: ${{ !matrix.ndk }}
        run: cargo build --manifest-path agent/Cargo.toml -p exe-mobile --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.target }}
          path: |
            agent/target/${{ matrix.target }}/release/libexe_mobile.a
            agent/target/${{ matrix.target }}/release/libexe_mobile.so
          if-no-files-found: ignore

  publish:
    name: publish release
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      # Only the desktop archives belong in a user-facing release; the mobile
      # libraries stay as CI artifacts for the app builds.
      - uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('exe-{0}', github.run_number) }}
