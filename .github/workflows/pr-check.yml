name: pr-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker:
    name: worker (typescript, console, protocol tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck worker and console
        run: pnpm typecheck
      - name: Every component shares one version
        run: pnpm version:check
      - name: Protocol tests
        run: pnpm test
      - name: Build console
        run: pnpm build

  rust:
    name: clients (rust, protocol vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
      - run: cargo fmt --manifest-path clients/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path clients/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path clients/Cargo.toml

  integration:
    name: integration (local worker + real client)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [worker, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --manifest-path clients/Cargo.toml
      - name: End-to-end protocol
        run: pnpm test:integration
      - name: End-to-end with the real binary
        run: pnpm test:client
      - name: End-to-end through MCP (a harness calling a device)
        run: pnpm test:mcp

  mobile:
    name: mobile libraries
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Install cargo-ndk
        working-directory: clients
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the Android library
        working-directory: clients
        run: cargo ndk -t arm64-v8a build -p exe-mobile --release
      - uses: actions/upload-artifact@v4
        with:
          name: exe-android-arm64
          path: clients/target/aarch64-linux-android/release/libexe_mobile.so

  pr-check:
    name: pr-check
    needs: [worker, rust, integration]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all required checks passed"
