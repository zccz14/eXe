name: pr-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker:
    name: worker (typescript, console, protocol tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck worker and console
        run: pnpm typecheck
      - name: Protocol tests
        run: pnpm test
      - name: Build console
        run: pnpm build

  rust:
    name: agent (rust, protocol vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo fmt --manifest-path agent/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path agent/Cargo.toml

  integration:
    name: integration (local worker + real agent)
    runs-on: ubuntu-latest
    needs: [worker, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --manifest-path agent/Cargo.toml
      - name: End-to-end protocol
        run: pnpm test:integration
      - name: End-to-end with the real binary
        run: pnpm test:agent

  mobile:
    name: mobile libraries
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build --manifest-path agent/Cargo.toml -p exe-mobile --release
      - uses: actions/upload-artifact@v4
        with:
          name: exe-android-arm64
          path: agent/target/aarch64-linux-android/release/libexe_mobile.so

  pr-check:
    name: pr-check
    needs: [worker, rust, integration]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all required checks passed"
