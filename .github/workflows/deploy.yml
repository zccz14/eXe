name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: worker + console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build console
        run: pnpm build
        env:
          # The console is a static Pages app; the relay lives on its own origin.
          VITE_API_BASE: https://exe.ntnl.io

      # Secrets cannot be referenced from a step `if`, so resolve readiness first.
      - name: Check deployment credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping deployment"
          fi

      - name: Apply the database schema
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute exe --remote --file worker/src/schema.sql

      # The draft protocol keeps no compatibility layer: the column is renamed
      # in place, once. Fresh databases already have `caller`, and the rename
      # then fails harmlessly.
      - name: Rename calls.issuer to calls.caller
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute exe --remote --command "ALTER TABLE calls RENAME COLUMN issuer TO caller"
        continue-on-error: true

      - name: Deploy the worker
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy the console to Pages
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy console/dist --project-name=exe-console --branch=main --commit-dirty=true

      - name: Smoke test
        if: steps.credentials.outputs.ready == 'true'
        run: |
          curl -fsS https://exe.ntnl.io/api/health
          curl -fsS -o /dev/null -w "console %{http_code}\n" https://exe.ntnl.io/
